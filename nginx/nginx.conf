server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router / client-side routing: any path that isn't a real file
    # falls back to index.html so deep links (e.g. /files, /shared) don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets (client/dist/assets/*)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
