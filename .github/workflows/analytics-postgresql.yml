name: Analytics PostgreSQL

on:
  pull_request:
    paths:
      - ".github/workflows/analytics-postgresql.yml"
      - "project-root/server/**"
  workflow_dispatch:

jobs:
  analytics-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trustshare_test
          POSTGRES_USER: trustshare
          POSTGRES_PASSWORD: trustshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustshare -d trustshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg2://trustshare:trustshare@localhost:5432/trustshare_test
      REQUIRE_POSTGRESQL: "true"
      PYTHONUTF8: "1"

    defaults:
      run:
        working-directory: project-root/server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-root/server/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL Analytics smoke test
        run: python -m pytest postgres_tests/test_analytics_postgresql.py -q
